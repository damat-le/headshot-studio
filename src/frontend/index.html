<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headshot Studio</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667085;
    --line: #e3e6ea; --accent: #0d4fe4; --accent-text: #ffffff; --drop: #eef2fb; --ok: #12805c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #222222; --panel: #313131; --text: #ececec; --muted: #adadad;
      --line: #4a4a4a; --accent: #e6e6e6; --accent-text: #222222; --drop: #3a3a3a; --ok: #4cc38a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 48px;
         display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .panel + .panel { margin-top: 16px; }
  label.title { display: block; font-weight: 600; font-size: 13px; margin: 18px 0 8px; }
  label.title:first-child { margin-top: 0; }

  #picker { display: none; }

  .models { display: grid; gap: 8px; }
  .model { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; text-align: left;
           width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px;
           background: none; color: inherit; font: inherit; cursor: pointer; }
  .model[aria-checked="true"] { border-color: var(--text); }
  .model svg { width: 20px; height: 20px; margin-top: 1px; }
  .model .ok { color: var(--ok); }
  .model .dl { color: var(--muted); }
  .model .name { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .model .tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px;
                background: var(--drop); color: var(--muted); }
  .model .size { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .model .good { font-size: 13px; margin-top: 3px; }

  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; cursor: pointer;
        outline: 1px solid var(--line); outline-offset: -1px; }
  .sw[aria-pressed="true"] { border-color: var(--text); }
  .custom { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
  .custom input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line);
                              border-radius: 6px; padding: 2px; background: none; cursor: pointer; }
  .hint { font-weight: 400; color: var(--muted); margin-left: 6px; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }

  .slider { display: flex; align-items: center; gap: 10px; }
  .slider input { flex: 1; accent-color: var(--accent); }
  .slider output { width: 36px; text-align: right; font-size: 13px; color: var(--muted); }

  button.go { margin-top: 16px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
              background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 15px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  .status { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .status.err { color: #d92d20; }

  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .views { grid-template-columns: 1fr; } }
  figure { margin: 0; }
  figcaption { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px;
               display: flex; justify-content: space-between; align-items: baseline; }
  figcaption a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .frame { aspect-ratio: 4 / 3; border-radius: 10px; background: var(--drop); border: 1px solid var(--line);
           display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 13px; }
  .frame img { width: 100%; height: 100%; object-fit: contain; }
  figcaption .fname { font-weight: 400; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  figcaption > span:first-child { display: flex; min-width: 0; }

  /* The Original frame doubles as the photo picker */
  .photo { position: relative; transition: border-color .15s; }
  .photo.empty { border: 1.5px dashed var(--line); cursor: pointer; text-align: center; padding: 16px; }
  .photo.empty:hover, .photo.empty:focus-visible, .photo.over { border-color: var(--accent); outline: none; }
  .photo.over { border-style: dashed; }
  .photo .prompt strong { color: var(--accent); }
  .photo .prompt small { display: block; margin-top: 4px; }
  .photo .remove { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
                   border: 0; background: rgba(0, 0, 0, .6); color: #fff; font-size: 18px; line-height: 30px;
                   cursor: pointer; opacity: 0; transition: opacity .15s; }
  .photo:hover .remove, .photo .remove:focus-visible { opacity: 1; }
  @media (hover: none) { .photo .remove { opacity: 1; } }  /* touch screens can't hover */
  .meta { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .spin { width: 22px; height: 22px; border: 2.5px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <section>
    <h1>Headshot Studio</h1>
    <p class="sub">Studio-style backdrop for portraits.</p>
    <div class="panel">
      <label class="title">Backdrop colour</label>
      <div class="swatches" id="swatches"></div>
      <div class="custom">
        <input type="color" id="custom" value="#0d4fe4" aria-label="Custom colour">
        <span>Custom colour · selected: <code id="hex">Sky blue</code></span>
      </div>

      <label class="title" for="gradient">Gradient <span class="hint">flat → spotlight</span></label>
      <div class="slider">
        <input type="range" id="gradient" min="0" max="2" step="0.05" value="1">
        <output id="gradientVal">1.00</output>
      </div>

      <label class="title" for="shadow">Shadow</label>
      <div class="slider">
        <input type="range" id="shadow" min="0" max="0.3" step="0.01" value="0.10">
        <output id="shadowVal">0.10</output>
      </div>
    </div>

    <div class="panel">
      <label class="title" id="modelLabel">Cutout model</label>
      <div class="models" id="models" role="radiogroup" aria-labelledby="modelLabel"></div>
    </div>

    <button class="go" id="go" disabled>Render</button>
    <div class="status" id="status"></div>
  </section>

  <section>
    <div class="views">
      <figure>
        <figcaption><span>Original<span class="fname" id="fileName"></span></span></figcaption>
        <div class="frame photo" id="before"></div>
      </figure>
      <figure>
        <figcaption>Result <a id="download" hidden>Download</a></figcaption>
        <div class="frame" id="after">Render to see the result</div>
      </figure>
    </div>
    <div class="meta" id="meta"></div>
  </section>
</main>
<input type="file" id="picker" accept="image/*">

<script>
const $ = id => document.getElementById(id);
// `color` is what the server receives: a preset name, or a hex code from the custom picker
let file = null, color = "sky-blue", resultUrl = null;

function selectPreset(p) {
  color = p.name;
  $("hex").textContent = p.label;
  $("custom").value = p.light.toLowerCase();  // the picker box shows (and starts from) the preset's colour
  document.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", s.dataset.name === p.name));
}
function selectCustom(hex) {
  color = hex.toUpperCase();
  $("hex").textContent = color;
  document.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", false));
}

// Same falloff as studio.py: the dark tone moves away from the light one by gradient^0.7,
// the lit area shrinks by (0.85 + 0.15 * gradient), and the fade follows clip(r)^1.8.
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
function swatchBackground(p, g) {
  const light = rgb(p.light), dark0 = rgb(p.dark);
  const dark = g === 1 ? dark0 : light.map((l, i) => Math.min(255, Math.max(0, l + (dark0[i] - l) * g ** 0.7)));
  const k = g === 1 ? 1 : 0.85 + 0.15 * g;
  const stops = [];
  for (let i = 0; i <= 10; i++) {
    const t = Math.min(1, (i / 10) * k) ** 1.8;
    const c = light.map((l, j) => Math.round(l + (dark[j] - l) * t));
    stops.push(`rgb(${c}) ${i * 10}%`);
  }
  return `radial-gradient(farthest-corner at 50% 35%, ${stops.join(", ")})`;
}
let presets = [];
function paintSwatches() {
  const g = Number($("gradient").value);
  document.querySelectorAll(".sw").forEach((b, i) => b.style.background = swatchBackground(presets[i], g));
}

fetch("/presets").then(r => r.json()).then(list => {
  presets = list;
  presets.forEach(p => {
    const b = document.createElement("button");
    b.className = "sw"; b.dataset.name = p.name;
    b.title = `${p.label} (${p.light} → ${p.dark})`; b.setAttribute("aria-label", p.label);
    b.onclick = () => selectPreset(p);
    $("swatches").append(b);
  });
  paintSwatches();
  selectPreset(presets.find(p => p.name === color) || presets[0]);
});
$("custom").oninput = e => selectCustom(e.target.value);

// Cutout model menu: a check icon means the model is on disk; a download icon means the first render downloads it.
const ICON_OK = '<svg class="ok" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.2 10.3l2.5 2.5 5.1-5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_DL = '<svg class="dl" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9.5m0 0l-3.6-3.6M10 12.5l3.6-3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 14.5v1.5a1 1 0 001 1h10a1 1 0 001-1v-1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
let models = [], model = null;
const sizeText = mb => mb >= 1000 ? `${(mb / 1000).toFixed(1)} GB` : `${mb} MB`;
function renderModels() {
  $("models").innerHTML = "";
  models.forEach(m => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "model"; b.setAttribute("role", "radio");
    b.setAttribute("aria-checked", m.name === model);
    b.innerHTML = `${m.downloaded ? ICON_OK : ICON_DL}
      <span><span class="name">${m.label}<span class="tag">${m.tag}</span></span>
      <span class="size" style="display:block">${sizeText(m.size_mb)} · ${m.downloaded ? "downloaded" : "downloads on first use"}</span>
      <span class="good" style="display:block">${m.good_for}</span></span>`;
    b.title = m.downloaded ? "Ready to use" : `Not downloaded yet: the first render downloads ${sizeText(m.size_mb)} once`;
    b.onclick = () => { model = m.name; renderModels(); };
    $("models").append(b);
  });
}
function loadModels() {
  return fetch("/models").then(r => r.json()).then(list => {
    models = list;
    model ??= (list.find(m => m.default) || list[0]).name;
    renderModels();
  });
}
loadModels();
$("shadow").oninput = e => $("shadowVal").textContent = Number(e.target.value).toFixed(2);
$("gradient").oninput = e => { $("gradientVal").textContent = Number(e.target.value).toFixed(2); paintSwatches(); };

// The Original frame is the picker: empty, it invites a click or a drop; filled, it shows the photo
// with an × to remove it. Dropping a new photo on it replaces the current one.
let photoUrl = null;
const photo = $("before");
function showEmpty() {
  photo.className = "frame photo empty";
  photo.tabIndex = 0; photo.setAttribute("role", "button");
  photo.setAttribute("aria-label", "Choose a photo");
  photo.innerHTML = '<div class="prompt"><strong>Choose a photo</strong> or drop it here<small>JPG or PNG, up to 60 MB</small></div>';
}
function pick(f) {
  if (!f || !f.type.startsWith("image/")) return status("That file is not an image.", true);
  file = f;
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = URL.createObjectURL(f);
  $("fileName").textContent = f.name; $("fileName").title = f.name;
  photo.className = "frame photo";
  photo.removeAttribute("tabindex"); photo.removeAttribute("role"); photo.removeAttribute("aria-label");
  photo.innerHTML = "";
  const img = new Image(); img.src = photoUrl; img.alt = f.name;
  const x = document.createElement("button");
  x.className = "remove"; x.type = "button"; x.textContent = "×";
  x.title = "Remove photo"; x.setAttribute("aria-label", "Remove photo");
  x.onclick = e => { e.stopPropagation(); removePhoto(); };
  photo.append(img, x);
  $("go").disabled = false; status("");
}
function removePhoto() {
  file = null; $("picker").value = "";
  if (photoUrl) URL.revokeObjectURL(photoUrl);
  photoUrl = null;
  $("fileName").textContent = "";
  showEmpty();
  $("go").disabled = true; status("");
}
showEmpty();
photo.onclick = () => !file && $("picker").click();
photo.onkeydown = e => !file && (e.key === "Enter" || e.key === " ") && (e.preventDefault(), $("picker").click());
$("picker").onchange = e => e.target.files[0] && pick(e.target.files[0]);
["dragover", "dragenter"].forEach(t => photo.addEventListener(t, e => { e.preventDefault(); photo.classList.add("over"); }));
["dragleave", "drop"].forEach(t => photo.addEventListener(t, e => { e.preventDefault(); photo.classList.remove("over"); }));
photo.addEventListener("drop", e => pick(e.dataTransfer.files[0]));

function status(msg, err = false) { $("status").textContent = msg; $("status").className = "status" + (err ? " err" : ""); }

$("go").onclick = async () => {
  $("go").disabled = true;
  $("after").innerHTML = '<div class="spin"></div>';
  const t0 = performance.now();
  const m = models.find(x => x.name === model);
  const what = m && !m.downloaded ? `Downloading ${m.label} (${sizeText(m.size_mb)}, one time) and rendering…` : "Rendering…";
  const tick = setInterval(() => status(`${what} ${((performance.now() - t0) / 1000).toFixed(0)} s`), 250);
  try {
    const q = new URLSearchParams({ name: file.name, color, model, gradient: $("gradient").value, shadow: $("shadow").value });
    const r = await fetch(`/render?${q}`, { method: "POST", body: file });
    if (!r.ok) throw new Error(await r.text());
    const blob = await r.blob();
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    $("after").innerHTML = ""; const img = new Image(); img.src = resultUrl; $("after").append(img);
    const out = r.headers.get("X-Output");
    Object.assign($("download"), { href: resultUrl, download: out.split("/").pop(), hidden: false });
    $("meta").textContent = `Saved to ${out} · light centred at (${r.headers.get("X-Center")}) · ${color} · ${m ? m.label : model}`;
    status(`Done in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  } catch (e) {
    $("after").textContent = "Render failed";
    status(e.message, true);
  } finally {
    clearInterval(tick); $("go").disabled = !file;  // the photo may have been removed mid-render
    loadModels();  // a first render may have just downloaded the model
  }
};
</script>
</body>
</html>
