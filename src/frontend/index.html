<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Background</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667085;
    --line: #e3e6ea; --accent: #0d4fe4; --accent-text: #ffffff; --drop: #eef2fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1b1e23; --text: #e8eaed; --muted: #9aa3ae;
      --line: #2c3138; --accent: #4f83f5; --accent-text: #0b0d10; --drop: #1d2532;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 48px;
         display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  label.title { display: block; font-weight: 600; font-size: 13px; margin: 18px 0 8px; }
  label.title:first-child { margin-top: 0; }

  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center;
          cursor: pointer; background: var(--drop); transition: border-color .15s; }
  .drop.over, .drop:hover { border-color: var(--accent); }
  .drop strong { color: var(--accent); }
  .drop small { display: block; color: var(--muted); margin-top: 4px; }
  .file { margin-top: 10px; font-size: 13px; color: var(--muted); word-break: break-all; }
  #picker { display: none; }

  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw { aspect-ratio: 1; border-radius: 8px; border: 2px solid transparent; cursor: pointer;
        outline: 1px solid var(--line); outline-offset: -1px; }
  .sw[aria-pressed="true"] { border-color: var(--text); }
  .custom { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
  .custom input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line);
                              border-radius: 6px; padding: 2px; background: none; cursor: pointer; }
  .hint { font-weight: 400; color: var(--muted); margin-left: 6px; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }

  .slider { display: flex; align-items: center; gap: 10px; }
  .slider input { flex: 1; accent-color: var(--accent); }
  .slider output { width: 36px; text-align: right; font-size: 13px; color: var(--muted); }

  button.go { margin-top: 22px; width: 100%; padding: 11px; border: 0; border-radius: 8px;
              background: var(--accent); color: var(--accent-text); font-weight: 600; font-size: 15px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  .status { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .status.err { color: #d92d20; }

  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .views { grid-template-columns: 1fr; } }
  figure { margin: 0; }
  figcaption { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px;
               display: flex; justify-content: space-between; align-items: baseline; }
  figcaption a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .frame { aspect-ratio: 4 / 3; border-radius: 10px; background: var(--drop); border: 1px solid var(--line);
           display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 13px; }
  .frame img { width: 100%; height: 100%; object-fit: contain; }
  .meta { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .spin { width: 22px; height: 22px; border: 2.5px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <section>
    <h1>Color Background</h1>
    <p class="sub">Studio-style backdrop for portraits.</p>
    <div class="panel">
      <label class="title">Photo</label>
      <div class="drop" id="drop" tabindex="0" role="button">
        <strong>Choose a photo</strong> or drop it here
        <small>JPG or PNG, up to 60 MB</small>
      </div>
      <input type="file" id="picker" accept="image/*">
      <div class="file" id="fileName"></div>

      <label class="title">Backdrop colour</label>
      <div class="swatches" id="swatches"></div>
      <div class="custom">
        <input type="color" id="custom" value="#0d4fe4" aria-label="Custom colour">
        <span>Custom colour · selected: <code id="hex">Sky blue</code></span>
      </div>

      <label class="title" for="gradient">Gradient <span class="hint">flat → spotlight</span></label>
      <div class="slider">
        <input type="range" id="gradient" min="0" max="2" step="0.05" value="1">
        <output id="gradientVal">1.00</output>
      </div>

      <label class="title" for="shadow">Shadow</label>
      <div class="slider">
        <input type="range" id="shadow" min="0" max="0.3" step="0.01" value="0.10">
        <output id="shadowVal">0.10</output>
      </div>

      <button class="go" id="go" disabled>Render</button>
      <div class="status" id="status"></div>
    </div>
  </section>

  <section>
    <div class="views">
      <figure>
        <figcaption>Original</figcaption>
        <div class="frame" id="before">No photo selected</div>
      </figure>
      <figure>
        <figcaption>Result <a id="download" hidden>Download</a></figcaption>
        <div class="frame" id="after">Render to see the result</div>
      </figure>
    </div>
    <div class="meta" id="meta"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
// `color` is what the server receives: a preset name, or a hex code from the custom picker
let file = null, color = "sky-blue", resultUrl = null;

function selectPreset(p) {
  color = p.name;
  $("hex").textContent = p.label;
  $("custom").value = p.light.toLowerCase();  // the picker box shows (and starts from) the preset's colour
  document.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", s.dataset.name === p.name));
}
function selectCustom(hex) {
  color = hex.toUpperCase();
  $("hex").textContent = color;
  document.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", false));
}

// Same falloff as studio.py: the dark tone moves away from the light one by gradient^0.7,
// the lit area shrinks by (0.85 + 0.15 * gradient), and the fade follows clip(r)^1.8.
const rgb = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
function swatchBackground(p, g) {
  const light = rgb(p.light), dark0 = rgb(p.dark);
  const dark = g === 1 ? dark0 : light.map((l, i) => Math.min(255, Math.max(0, l + (dark0[i] - l) * g ** 0.7)));
  const k = g === 1 ? 1 : 0.85 + 0.15 * g;
  const stops = [];
  for (let i = 0; i <= 10; i++) {
    const t = Math.min(1, (i / 10) * k) ** 1.8;
    const c = light.map((l, j) => Math.round(l + (dark[j] - l) * t));
    stops.push(`rgb(${c}) ${i * 10}%`);
  }
  return `radial-gradient(farthest-corner at 50% 35%, ${stops.join(", ")})`;
}
let presets = [];
function paintSwatches() {
  const g = Number($("gradient").value);
  document.querySelectorAll(".sw").forEach((b, i) => b.style.background = swatchBackground(presets[i], g));
}

fetch("/presets").then(r => r.json()).then(list => {
  presets = list;
  presets.forEach(p => {
    const b = document.createElement("button");
    b.className = "sw"; b.dataset.name = p.name;
    b.title = `${p.label} (${p.light} → ${p.dark})`; b.setAttribute("aria-label", p.label);
    b.onclick = () => selectPreset(p);
    $("swatches").append(b);
  });
  paintSwatches();
  selectPreset(presets.find(p => p.name === color) || presets[0]);
});
$("custom").oninput = e => selectCustom(e.target.value);
$("shadow").oninput = e => $("shadowVal").textContent = Number(e.target.value).toFixed(2);
$("gradient").oninput = e => { $("gradientVal").textContent = Number(e.target.value).toFixed(2); paintSwatches(); };

function pick(f) {
  if (!f || !f.type.startsWith("image/")) return status("That file is not an image.", true);
  file = f;
  $("fileName").textContent = f.name;
  $("before").innerHTML = ""; const img = new Image(); img.src = URL.createObjectURL(f); $("before").append(img);
  $("go").disabled = false; status("");
}
$("drop").onclick = () => $("picker").click();
$("drop").onkeydown = e => (e.key === "Enter" || e.key === " ") && $("picker").click();
$("picker").onchange = e => pick(e.target.files[0]);
["dragover", "dragenter"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));

function status(msg, err = false) { $("status").textContent = msg; $("status").className = "status" + (err ? " err" : ""); }

$("go").onclick = async () => {
  $("go").disabled = true;
  $("after").innerHTML = '<div class="spin"></div>';
  const t0 = performance.now();
  const tick = setInterval(() => status(`Rendering… ${((performance.now() - t0) / 1000).toFixed(0)} s`), 250);
  try {
    const q = new URLSearchParams({ name: file.name, color, gradient: $("gradient").value, shadow: $("shadow").value });
    const r = await fetch(`/render?${q}`, { method: "POST", body: file });
    if (!r.ok) throw new Error(await r.text());
    const blob = await r.blob();
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    $("after").innerHTML = ""; const img = new Image(); img.src = resultUrl; $("after").append(img);
    const out = r.headers.get("X-Output");
    Object.assign($("download"), { href: resultUrl, download: out.split("/").pop(), hidden: false });
    $("meta").textContent = `Saved to ${out} · light centred at (${r.headers.get("X-Center")}) · ${color}`;
    status(`Done in ${((performance.now() - t0) / 1000).toFixed(1)} s`);
  } catch (e) {
    $("after").textContent = "Render failed";
    status(e.message, true);
  } finally {
    clearInterval(tick); $("go").disabled = false;
  }
};
</script>
</body>
</html>
